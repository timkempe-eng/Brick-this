name: Release to TestFlight

# Builds a signed build and ships it to TestFlight, with no Mac anywhere.
# Run it from the Actions tab on github.com, which works from an iPad.
#
# Signing follows docs/DEV_SETUP.md in timkempe-eng/hydive: fastlane match,
# never Xcode automatic signing. See docs/signing.md for why.
#
# Required repository secrets:
#   APPLE_TEAM_ID   10-character Team ID (Developer account → Membership)
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_ISSUER_ID   the issuer id above the key list
#   ASC_KEY_P8      base64 of AuthKey_XXXX.p8 — NOT the raw file
#   MATCH_PASSWORD  passphrase for the stored certificates
#   MATCH_GIT_TOKEN PAT with contents:read on the repo named by MATCH_GIT_URL.
#                   Only needed when that is NOT this repo — Actions' own
#                   GITHUB_TOKEN cannot read another repository's branch.
#
# Required repository variable:
#   MATCH_GIT_URL   repo holding the `match` branch. This account already ships
#                   other apps, so point it at their repo and REUSE that
#                   distribution certificate: Apple caps them at about two, and
#                   a second app needs no new one. See docs/signing.md.
#
# This cannot succeed until Apple approves Family Controls (Distribution) for
# all four bundle ids, AND the capability is enabled on each App ID: match does
# not manage capabilities, so a profile minted before the capability exists
# will not authorize it.

on:
  workflow_dispatch:
    inputs:
      force_profiles:
        description: "Regenerate provisioning profiles (only after changing capabilities)"
        type: choice
        options: ["false", "true"]
        default: "false"
      notes:
        description: "What's new in this build (shown to testers)"
        required: false
        default: "Latest from the trunk."

permissions:
  contents: write   # match stores certificates on a branch of a repo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Before anything that compiles or resolves dependencies. Apple rejects
      # uploads built against an old SDK — a 409 after a twenty-minute build —
      # so the toolchain is pinned rather than inherited from the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          pip3 install --quiet pyyaml
          bundle exec fastlane ios beta force_profiles:${{ inputs.force_profiles }} \
            || fastlane ios beta force_profiles:${{ inputs.force_profiles }}

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dad-ipa
          path: build/*.ipa
          if-no-files-found: warn
