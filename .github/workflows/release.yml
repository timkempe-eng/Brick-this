name: Release to TestFlight

# Builds a signed build and ships it to TestFlight, with no Mac anywhere.
# Run it from the Actions tab on github.com, which works from an iPad.
#
# Signing follows docs/DEV_SETUP.md in timkempe-eng/hydive: fastlane match,
# never Xcode automatic signing. See docs/signing.md for why.
#
# Required repository secrets:
#   APPLE_TEAM_ID   10-character Team ID (Developer account → Membership)
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_ISSUER_ID   the issuer id above the key list
#   ASC_KEY_P8      base64 of AuthKey_XXXX.p8 — NOT the raw file
#   MATCH_PASSWORD  passphrase for the stored certificates
#   MATCH_GIT_TOKEN Fine-grained PAT with Contents read AND WRITE on the repo
#                   named by MATCH_GIT_URL. Actions' own GITHUB_TOKEN is scoped
#                   to this repository and cannot reach another one.
#
# Required repository variable:
#   MATCH_GIT_URL   An empty PRIVATE repo for match to store the encrypted
#                   certificate and key in. It must not be this repo, which is
#                   public; the lane refuses a public store. Dad keeps its own
#                   store rather than sharing another project's, so that a
#                   revoked cert on either side cannot break the other.
#                   See docs/signing.md.
#
# This cannot succeed until Apple approves Family Controls (Distribution) for
# all four bundle ids, AND the capability is enabled on each App ID: match does
# not manage capabilities, so a profile minted before the capability exists
# will not authorize it.

on:
  workflow_dispatch:
    inputs:
      force_profiles:
        description: "Regenerate provisioning profiles (only after changing capabilities)"
        type: choice
        options: ["false", "true"]
        default: "false"
      notes:
        description: "What's new in this build (shown to testers)"
        required: false
        default: "Latest from the trunk."

  # The Family Controls approval watch. Apple acknowledges nothing and issues
  # no case id, so a signed build is the only reliable signal — and while the
  # request is pending the run fails at signing in 46 seconds, before anything
  # expensive compiles. The run that first sees the approval is therefore also
  # the run that ships, with nobody watching at the moment it happens.
  #
  # This replaced a Claude Routine that fired every three days and reported
  # success without dispatching anything: its sessions got no repository and
  # no token, so its one job was the one thing it could not do. A schedule on
  # a runner that already holds the secrets cannot fail that way.
  #
  # Delete this trigger once a build reaches TestFlight — past that point it
  # would ship an unattended build every three days forever. GitHub also
  # disables schedules after 60 days without repository activity.
  schedule:
    - cron: "0 15 */3 * *"

permissions:
  contents: write   # match stores certificates on a branch of a repo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Before anything that compiles or resolves dependencies. Apple rejects
      # uploads built against an old SDK — a 409 after a twenty-minute build —
      # so the toolchain is pinned rather than inherited from the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # apply_signing.py needs pyyaml. The runner's system Python is externally
      # managed (PEP 668) and refuses `pip3 install` outright, so bring our own.
      # test.yml has always done this and release.yml never did — a difference
      # that could only show up on a signing run, which is the run you least
      # want to spend on a dependency.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes || 'Latest from the trunk.' }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          # A scheduled run has no inputs at all, so this falls back to true —
          # and it must stay true. match matches profiles on expiry and
          # certificate rather than on capability set, so a run that reused one
          # minted before the approval would report the old answer forever.
          # A dispatch passing "false" keeps it: only an absent input is falsy
          # here, and "false" is a non-empty string. Measured rather than
          # reasoned — run 34138328138 dispatched force_profiles:"false" and
          # created zero profiles, reusing the five ids the run before it had
          # minted. The expression can only return the input or 'true', and
          # 'true' would have regenerated all five. Read through the
          # environment rather than interpolated into the script, so an input
          # is never shell.
          FORCE_PROFILES: ${{ inputs.force_profiles || 'true' }}
        run: |
          python3 -m pip install --quiet pyyaml
          bundle exec fastlane ios beta force_profiles:"$FORCE_PROFILES" \
            || fastlane ios beta force_profiles:"$FORCE_PROFILES"

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dad-ipa
          path: build/*.ipa
          if-no-files-found: warn
