name: Test

# Every push that could change what the app does. A commit that only touches
# docs, Markdown or the hardware tree skips this entirely — the Linux jobs
# read none of it and the macOS job would rent a Mac for six minutes to prove
# nothing. A newer push to the same branch cancels the run it supersedes:
# with sessions landing a commit every few minutes, three builds of three
# stale heads were running at once before this existed.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "hardware/**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Foundation-only core: the engine, schedules, allowance and stats maths.
  # Runs on Linux in seconds, and is where the real behaviour is verified.
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
      - name: vocabulary lint
        run: ./scripts/lint-vocabulary.sh

  # Separate job because the Swift container has no pip. Also runs in parallel.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: preflight (Xcode wiring)
        run: python3 scripts/preflight.py

  # The part that needs a Mac — and this is the only Mac involved.
  #
  # Compiles the app and all three extensions against the real iOS SDK, which
  # is the only thing that can catch a type error in the SwiftUI layer, the
  # adapters, or the extensions. Code signing is off: this proves the code
  # compiles, not that it can be installed. Signing happens in release.yml.
  #
  # macOS runners are free for public repositories.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Build app and extensions
        run: |
          xcodebuild build \
            -project Dad.xcodeproj \
            -scheme Dad \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1

      - name: What the build said
        if: always()
        run: |
          echo "--- errors and warnings (empty if none) ---"
          grep -E "error:|warning:" build.log | sort -u | head -40 || echo "none"
          echo "::group::Last 120 lines"
          tail -120 build.log
          echo "::endgroup::"

      # Compilation proves the code type-checks. This proves it *runs* — the
      # App Group resolving, SwiftUI surviving a first layout, the extensions
      # embedding. Screen Time and NFC no-op in the Simulator, so this can
      # never show that a tap blocks anything; it catches the launch crashes
      # that would otherwise reach a device unexamined.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          if [ -z "$NAME" ]; then
            echo "::error::No iPhone simulator available on this image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Launch the app on a simulator
        run: |
          xcodebuild test \
            -project Dad.xcodeproj \
            -scheme Dad \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1

      # Never pipe this through `tail`. A failing xcodebuild prints the
      # assertion and then several hundred lines of unrelated build output, so
      # a fixed tail reliably hides the one line you need — which is how five
      # CI runs were spent theorising about a failure whose message was right
      # there in a log nobody kept. Grep for the failure, then keep the log.
      - name: What the tests said
        if: always()
        run: |
          echo "--- failures (empty if none) ---"
          grep -E "error:|Failing tests:" test.log || echo "none"
          echo "--- suites ---"
          grep -E "Test Suite .*(passed|failed)" test.log | tail -20 || true
          echo "::group::Last 200 lines"
          tail -200 test.log
          echo "::endgroup::"

      - name: Keep the log and the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          retention-days: 7
