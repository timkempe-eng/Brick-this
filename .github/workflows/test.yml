name: Test

# Only the Foundation-only core can be tested here — everything touching
# FamilyControls, ManagedSettings, DeviceActivity, CoreNFC or SwiftUI needs
# Xcode and a device. That's still the part where the fiddly logic lives.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

      - name: vocabulary lint
        run: ./scripts/lint-vocabulary.sh

      - name: preflight (Xcode wiring)
        run: |
          pip install --quiet pyyaml
          python3 scripts/preflight.py
