# XcodeGen spec. Generate the Xcode project with:
#
#   brew install xcodegen && xcodegen generate && open Tim.xcodeproj
#
# The project file is deliberately not committed — it is generated output, and
# regenerating it is how you pick up new source files.

name: Tim
options:
  bundleIdPrefix: app.tim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Replace with your own Apple Developer Team ID before building on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Swift language version, not toolchain: valid values are 4.0/4.2/5.0/6.0.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Tim:
    build:
      targets:
        Tim: all
        TimUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimUITests

targets:

  Tim:
    type: application
    platform: iOS
    sources:
      - Tim/App
      - Tim/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
      - path: Tim/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim
        INFOPLIST_FILE: Tim/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tim/App/Tim.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TimShieldConfiguration
      - target: TimShieldAction
      - target: TimActivityMonitor
      - target: TimWidget
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: CoreNFC.framework
      - sdk: WidgetKit.framework

  # Draws the "Timmed." screen over blocked apps.
  TimShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - Tim/Extensions/ShieldConfiguration
      - Tim/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim.ShieldConfiguration
        INFOPLIST_FILE: Tim/Extensions/ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tim/Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
    dependencies:
      # All targets compile the whole Tim/Shared tree, adapters included, so
      # each needs every framework the adapters import.
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: WidgetKit.framework

  # Handles the buttons on that screen.
  TimShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - Tim/Extensions/ShieldAction
      - Tim/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim.ShieldAction
        INFOPLIST_FILE: Tim/Extensions/ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tim/Extensions/ShieldAction/ShieldAction.entitlements
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: WidgetKit.framework

  # Ends timed sessions without the app running.
  TimActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Tim/Extensions/ActivityMonitor
      - Tim/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim.ActivityMonitor
        INFOPLIST_FILE: Tim/Extensions/ActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tim/Extensions/ActivityMonitor/ActivityMonitor.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: WidgetKit.framework

  # Reads the session and draws it on the Lock Screen.
  #
  # Sources are deliberately narrow — Core plus UserDefaultsStore — rather than
  # the whole Tim/Shared tree the other targets take. Compiling the rest would
  # drag in FamilyControls, ManagedSettings and DeviceActivity, and with them a
  # family-controls entitlement this target has no use for and a fifth bundle
  # id needing Apple's manual approval.
  TimWidget:
    type: app-extension
    platform: iOS
    sources:
      - Tim/Widget
      - Tim/Shared/Core
      - Tim/Shared/Adapters/UserDefaultsStore.swift
      - path: Tim/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim.Widget
        INFOPLIST_FILE: Tim/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tim/Widget/Widget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Proves the app launches and renders. Not shipped, not signed by match —
  # preflight skips test bundles for the checks that only apply to products.
  TimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tim/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tim.Tim.UITests
        TEST_TARGET_NAME: Tim
    dependencies:
      - target: Tim
