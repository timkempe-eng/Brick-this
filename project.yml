# XcodeGen spec. Generate the Xcode project with:
#
#   brew install xcodegen && xcodegen generate && open Dad.xcodeproj
#
# The project file is deliberately not committed — it is generated output, and
# regenerating it is how you pick up new source files.

name: Dad
options:
  bundleIdPrefix: app.dad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Replace with your own Apple Developer Team ID before building on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Swift language version, not toolchain: valid values are 4.0/4.2/5.0/6.0.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Dad:
    build:
      targets:
        Dad: all
        DadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DadUITests

targets:

  Dad:
    type: application
    platform: iOS
    sources:
      - Dad/App
      - Dad/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
      - path: Dad/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad
        INFOPLIST_FILE: Dad/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dad/App/Dad.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DadShieldConfiguration
      - target: DadShieldAction
      - target: DadActivityMonitor
      - target: DadWidget
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: CoreNFC.framework
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework

  # Draws the "Dadded." screen over blocked apps.
  DadShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - Dad/Extensions/ShieldConfiguration
      - Dad/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad.ShieldConfiguration
        INFOPLIST_FILE: Dad/Extensions/ShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dad/Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
    dependencies:
      # All targets compile the whole Dad/Shared tree, adapters included, so
      # each needs every framework the adapters import.
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework

  # Handles the buttons on that screen.
  DadShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - Dad/Extensions/ShieldAction
      - Dad/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad.ShieldAction
        INFOPLIST_FILE: Dad/Extensions/ShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dad/Extensions/ShieldAction/ShieldAction.entitlements
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework

  # Ends timed sessions without the app running.
  DadActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Dad/Extensions/ActivityMonitor
      - Dad/Shared      # recursive: includes Shared/Core, the Foundation-only
                        # part that `swift test` also builds via Package.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad.ActivityMonitor
        INFOPLIST_FILE: Dad/Extensions/ActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dad/Extensions/ActivityMonitor/ActivityMonitor.entitlements
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework
      - sdk: WidgetKit.framework
      - sdk: UserNotifications.framework

  # Reads the session and draws it on the Lock Screen.
  #
  # Sources are deliberately narrow — Core plus UserDefaultsStore — rather than
  # the whole Dad/Shared tree the other targets take. Compiling the rest would
  # drag in FamilyControls, ManagedSettings and DeviceActivity, and with them a
  # family-controls entitlement this target has no use for and a fifth bundle
  # id needing Apple's manual approval.
  DadWidget:
    type: app-extension
    platform: iOS
    sources:
      - Dad/Widget
      - Dad/Shared/Core
      - Dad/Shared/Adapters/UserDefaultsStore.swift
      - path: Dad/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad.Widget
        INFOPLIST_FILE: Dad/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dad/Widget/Widget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Proves the app launches and renders. Not shipped, not signed by match —
  # preflight skips test bundles for the checks that only apply to products.
  DadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Dad/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dad.Dad.UITests
        TEST_TARGET_NAME: Dad
    dependencies:
      - target: Dad
